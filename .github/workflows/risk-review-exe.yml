name: Build Cashed Risk Review (Windows)

on:
  push:
    branches: [main]
    paths: ["risk_app.py", "risk_review.py", "risk_report.py", "risk_selftest.py", ".github/workflows/risk-review-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller tzdata
      - name: Build the .exe
        run: pyinstaller --onefile --windowed --name CashedRiskReview --collect-data tzdata --hidden-import tzdata risk_app.py
      - name: Self-test (parse + report)
        run: python risk_selftest.py
        env:
          PYTHONUTF8: "1"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: risk-review-${{ github.run_number }}
          name: Cashed Risk Review ${{ github.run_number }}
          files: dist/CashedRiskReview.exe
          body_path: selftest.txt
